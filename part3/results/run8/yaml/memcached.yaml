apiVersion: v1
kind: Pod
metadata:
  name: some-memcached
  labels:
    name: some-memcached
spec:
  containers:
    - image: anakli/memcached:t1
      name: memcached
      imagePullPolicy: Always
      command: ["/bin/sh"]
      args: ["-c", "./memcached -t 4 -u memcache"]
      resources:
        requests:
          cpu: "1500m"
          memory: "512Mi"
        limits:
          cpu: "4"
          memory: "1Gi"
  nodeSelector:
    cca-project-nodetype: "node-b-4core"


